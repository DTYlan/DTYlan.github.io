<!DOCTYPE html>

<html lang="en">

	<head>
		<meta charset="UTF-8">
		<meta name="viewport" content="width=device-width, initial-scale=1">
		<meta http-equiv="X-UA-Compatible" content="IE=edge">
		<meta name="color-scheme" content="light dark">
		<title>DTYlan's TOD Calculator</title>
		<link rel="stylesheet" href="./pico.min.css">
	</head>
	
	<body>
		<header class="container">
			<hgroup>
				<h1>DTYlan's TOD Calculator</h1>
				<p>Calculate TOD with adjustable Descent Path and Speed Constraints.</p>
			</hgroup>
		</header>
		
		<main class="container">
			<hgroup>
				<h4>Tutorial</h4>
				<p></p>
			</hgroup>
		
			<fieldset class="grid">
				<label>
					Current Altitude:
					<div role="group">
						<input type="number" id="curAlt" min="0" max="66000" step="1" placeholder="24000" required>
						<input type="submit" value="feet" class="outline contrast" disabled>
					</div>
				</label>
				<label>
					Target Altitude:
					<div role="group">
						<input type="number" id="tarAlt" min="0" max="66000" step="1" placeholder="3000" required>
						<input type="submit" value="feet" class="outline contrast" disabled>
					</div>
				</label>
			</fieldset>
			<fieldset class="grid">
				<label>
					Target Descent Path:
					<div role="group">
						<input type="number" id="tarRate" min="0.1" max="10" step="0.1" placeholder="3" value="3" required>
						<input type="submit" value="degrees" class="outline contrast" disabled>
					</div>
				</label>
				<label>
					Indicated Airspeed:
					<div role="group">
						<input type="number" id="spd" min="100" max="500" step="1" placeholder="300" required>
						<input type="submit" value="knots" class="outline contrast" disabled>
					</div>
				</label>
			</fieldset>
			<fieldset class="grid">
				<label>
					Speed Constraint:
					<div role="group">
						<input type="number" id="spdAtAlt" min="100" max="500" step="1" placeholder="250" value="250" required>
						<input type="submit" value="knots" class="outline contrast" disabled>
					</div>
				</label>
				<label>
					Altitude Constraint:
					<div role="group">
						<input type="number" id="spdAlt" min="0" max="66000" step="1" placeholder="10000" value="10000" required>
						<input type="submit" value="feet" class="outline contrast" disabled>
					</div>
				</label>
			</fieldset>
			
			<button id="calBtn">Calculate</button>
			<button id="rstBtn" class="secondary">Reset</button>
			
			<div id="result"></div>
		</main>
		
		<footer class="container">
			<p>Copyright 2026 &copy;</p>
		</footer>
		
		<script src="./script.js"></script>
	</body>

</html>
